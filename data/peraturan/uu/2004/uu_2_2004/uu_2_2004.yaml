uji_materi:
- putusan: 132/PUU-XXIII/2025
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/212/132_PUU-XXIII_2025.pdf
  amar: Pasal 82 Undang-Undang Nomor 2 Tahun 2004 tentang Penyelesaian Perselisihan
    Hubungan Industrial (Lembaran Negara Republik Indonesia Tahun 2004 Nomor 6, Tambahan
    Lembaran Negara Republik Indonesia Nomor 4356) sebagaimana telah dimaknai terakhir
    dalam Putusan Mahkamah Konstitusi Nomor 94/PUU-XXI/2023 bertentangan dengan Undang
    Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak mempunyai kekuatan
    hukum mengikat secara bersyarat sepanjang tidak dimaknai “Gugatan oleh pekerja/buruh
    atas pemutusan hubungan kerja dapat diajukan hanya dalam tenggang waktu 1 (satu)
    tahun sejak tidak tercapainya kesepakatan perundingan mediasi atau konsiliasi.”
- putusan: 49/PUU-XIV/2016
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/8/49_PUU-XIV_2016.pdf
  amar: Pasal 67 ayat (2) Undang-Undang Nomor 2 Tahun 2004 tentang Penyelesaian Perselisihan
    Hubungan Industrial bertentangan dengan UUD NRI Tahun 1945 dan tidak mempunyai
    kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai, "Masa tugas
    Hakim Ad-Hoc adalah untuk jangka waktu 5 (lima) tahun dan dapat diangkat kembali
    setiap 5 (lima) tahun yang diusulkan oleh Ketua Mahkamah Agung dengan terlebih
    dahulu memperoleh persetujuan dari lembaga pengusul yang prosesnya sesuai dengan
    Undang-Undang yang berlaku."
- putusan: 68/PUU-XIII/2015
  url: https://peraturan.bpk.go.id/DownloadUjiMateri/53/68_PUU-XIII_2015.pdf
  amar: a. Frasa "anjuran tertulis" dalam Pasal 13 ayat (2) huruf a Undang-Undang
    Nomor 2 Tahun 2004 tentang Penyelesaian Perselisihan Hubungan Industrial bertentangan
    dengan UUD NRI Tahun 1945 dan tidak mempunyai kekuatan hukum mengikat sepanjang
    tidak dimaknai "dalam hal tidak tercapai kesepakatan penyelesaian perselisihan
    hubungan industrial melalui mediasi, maka mediator mengeluarkan anjuran tertulis
    dalam bentuk risalah penyelesaian melalui mediasi." b. Frasa "anjuran tertulis"
    dalam Pasal 23 ayat (2) huruf a Undang-Undang Nomor 2 Tahun 2004 tentang Penyelesaian
    Perselisihan Hubungan Industrial bertentangan dengan UUD NRI Tahun 1945 dan tidak
    mempunyai kekuatan hukum mengikat sepanjang tidak dimaknai "dalam hal tidak tercapai
    kesepakatan penyelesaian perselisihan hubungan industrial melalui konsiliasi,
    maka konsiliator mengeluarkan anjuran tertulis dalam bentuk risalah penyelesaian
    melalui konsiliasi."
