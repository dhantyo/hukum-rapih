  amar: Penjelasan Pasal 4 ayat (1) huruf a Undang-Undang Nomor 8 Tahun 2016 tentang
    Penyandang Disabilitas (Lembaran Negara Republik Indonesia Tahun 2016 Nomor 69
    dan Tambahan Lembaran Negara Republik Indonesia Nomor 5871) bertentangan dengan
    Undang-Undang Dasar Negara Republik Indonesia Tahun 1945 dan tidak memiliki kekuatan
    hukum mengikat secara bersyarat sepanjang tidak dimaknai, “Yang dimaksud dengan
    Penyandang Disabilitas fisik adalah terganggunya fungsi gerak, antara lain amputasi,
    lumpuh layuh atau kaku, paraplegi, celebral palsy (CP), akibat stroke, akibat
    kusta, dan orang kecil, serta penyandang atau penderita penyakit kronis lainnya
    setelah melalui asesmen oleh tenaga medis yang merupakan pilihan secara sukarela
    dari penyandang atau penderita penyakit kronis”
