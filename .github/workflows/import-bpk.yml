name: Import from BPK

# Imports regulations from peraturan.bpk.go.id (JDIH BPK), the main source since 2026-11-21:
# metadata into data/, every PDF's sha256 recorded in the manifest (PDFs are not kept), text for
# records that have none. Records imported earlier from peraturan.go.id keep their text (the BPK
# PDF is parsed for comparison). Batches of 50, committed and pushed after each, so
# runs resume; once everything is in, runs only pick up new regulations.
# Cloudflare: a stealth browser (Scrapling) clears the check, curl_cffi downloads
# (pipeline/src/hukum_rapih/sources/bpk_session.py). No VPN needed: BPK is not geo-blocked.
# A PDF that frenicohansen/idn-dharmasastra-archive has on archive.org comes from there when its
# sha256 matches, without Cloudflare (decision 0029).
on:
  # schedule paused 2026-11-21: parser fixes first. To resume, restore:
  # schedule:
  #   - cron: "41 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      mode:
        description: "import: from BPK (metadata, PDFs, texts). reparse: texts from our archive.org copies"
        type: choice
        default: import
        options: [import, reparse]
      jenis:
        description: "Type of regulation (keppres: only Keppres 150/1959; uud: the UUD 1945, its amendments and the check against the consolidated text)"
        default: "uu"
        type: choice
        options: [uu, perppu, pp, perpres, keppres, uud]
      batches:
        description: "Max batches of 50 (0 = until the time budget is used)"
        default: "0"
      only:
        description: "Just these ids, comma-separated (e.g. uu_4_2009,uu_31_1999)"
        type: string
        default: ""
      no_text:
        description: "PDFs only: download and record hashes, leave texts alone"
        type: boolean
        default: false
      chain:
        description: "When the time is up with work left, start the next run automatically"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write # to start the next run when this one ends with work left

concurrency:
  group: import-peraturan # never together with other jobs that write data/
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      HUKUM_RAPIH_OCR_CACHE: /home/runner/ocr-cache # raw OCR of scanned pages, kept between runs (.github/actions/ocr-cache)
      JENIS: ${{ inputs.jenis || 'uu' }}
      BATCHES: ${{ inputs.batches || '0' }}
      BATCH: "50"
      ONLY: ${{ inputs.only && format('--only={0}', inputs.only) || '' }}
      NO_TEXT: ${{ inputs.no_text && '--no-text' || '' }}
      MODE: ${{ inputs.mode || 'import' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: ./.github/actions/ocr-cache
        with:
          step: restore
          path: ${{ env.HUKUM_RAPIH_OCR_CACHE }}
      - name: "Install (stealth browser, OCR for scanned PDFs: Indra, Tesseract as fallback)"
        run: |
          sudo apt-get install -y -qq xvfb tesseract-ocr tesseract-ocr-ind hunspell hunspell-id hunspell-en-us >/dev/null   # OCR for scans
          cd pipeline && uv sync --extra bpk --extra ocr && uv run scrapling install
          uv run python -c 'import indra_ocr; indra_ocr.load()'   # Indra's models (~76 MB) once, before the parallel OCR workers
      - name: Import in batches
        env:
          # one Cloudflare clearance and one walk of the listing for all batches of this run
          HUKUM_RAPIH_BPK_CACHE: ${{ runner.temp }}/bpk
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "hukum-rapih bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # a run that waited in the queue starts from the commit it was dispatched on; take what
          # the runs before it pushed, or its first push conflicts (2026-11-28)
          git pull -q --no-rebase --no-edit origin "${GITHUB_REF_NAME}"
          # The job is stopped at 5h45m (timeout-minutes) and a batch is only saved when it ends,
          # so a batch starts only if it will fit: estimated by the longest of the last three
          # batches (scans take ~1 h a batch, typed laws ~12 min), plus 5 minutes to commit.
          end=$(( $(date +%s) + 340 * 60 ))
          batch=0; recent=""; estimate=0; total=0; left=no
          while :; do
            if [ $(( $(date +%s) + estimate + 300 )) -ge "$end" ]; then left=yes; break; fi
            batch=$((batch + 1)); started=$(date +%s)
            if [ "$MODE" = reparse ]; then
              out=$(cd pipeline && uv run hukum-rapih reparse-bpk --limit "$BATCH" $ONLY 2>&1 | tee /dev/stderr || true)
            else
              out=$(cd pipeline && xvfb-run -a uv run hukum-rapih import-bpk "$JENIS" --limit "$BATCH" $ONLY $NO_TEXT --check-dir "$RUNNER_TEMP/uud-check" 2>&1 | tee /dev/stderr || true)
            fi
            # each law is shown in the log as it is done (tee above); $out is kept for the summary
            n=$(echo "$out" | grep -c '^ok' || true)
            echo "$out" | grep -E '^(ok|FAIL|STOP|done)' >> "$GITHUB_STEP_SUMMARY" || true
            (cd pipeline && uv run hukum-rapih relations)   # link amendments, revocations
            if [ -f "$RUNNER_TEMP/uud-check/uud_1945_satu-naskah.txt" ]; then   # decision 0027
              (cd pipeline && uv run python scripts/check_uud.py "$RUNNER_TEMP/uud-check/uud_1945_satu-naskah.txt" --out "$RUNNER_TEMP/uud-check/report.md") || true
              cat "$RUNNER_TEMP/uud-check/report.md" >> "$GITHUB_STEP_SUMMARY" || true
            fi
            git add data/
            if ! git diff --cached --quiet; then
              git commit -qm "peraturan/$JENIS: $MODE $n from peraturan.bpk.go.id"
              for i in 1 2 3 4 5; do
                git pull -q --no-rebase --no-edit origin "${GITHUB_REF_NAME}" && git push -q && break
                sleep $((i * 20))
              done
            fi
            echo "$out" | grep -q '^STOP' && { echo "::error::Cloudflare stopped the import"; exit 1; }
            took=$(( $(date +%s) - started )); total=$((total + n))
            recent=$(echo "$recent $took" | awk '{s=(NF>3?NF-2:1); o=""; for(i=s;i<=NF;i++) o=o" "$i; print o}')
            estimate=$(echo "$recent" | awk '{m=0; for(i=1;i<=NF;i++) if($i>m) m=$i; print m}')
            echo "batch $batch: $n law(s) in $((took / 60)) min"
            [ "$n" -eq 0 ] && break
            [ -n "$ONLY" ] && break                      # a list of ids is done in one go
            case "$JENIS" in keppres|uud) break ;; esac  # a few fixed entries, done in one go
            [ "$BATCHES" -gt 0 ] && [ "$batch" -ge "$BATCHES" ] && break
          done
          echo "From BPK: $(grep -l '^bpk:' -r data/peraturan/$JENIS --include='*.yaml' | wc -l) of $(find data/peraturan/$JENIS -name '*.yaml' | wc -l) records" | tee -a "$GITHUB_STEP_SUMMARY"
          # Out of time with work left, and this run got something done (not stuck on errors or
          # stopped by Cloudflare, which exit above): start the next run with the same inputs.
          if [ "$left" = yes ] && [ "$total" -gt 0 ] && [ -z "$ONLY" ] && [ "${{ inputs.chain }}" != false ]; then
            echo "Time is up with work left: starting the next run" | tee -a "$GITHUB_STEP_SUMMARY"
            gh workflow run import-bpk.yml --ref "${GITHUB_REF_NAME}" -f mode="$MODE" -f jenis="$JENIS" \
              -f batches="$BATCHES" -f no_text="${{ inputs.no_text }}" -f chain=true
          fi
      - name: "UUD: how the parser read each PDF, for review (decision 0027)"
        if: env.JENIS == 'uud'
        run: |
          cd pipeline
          for pdf in "$RUNNER_TEMP"/uud-check/*.pdf; do
            uv run hukum-rapih explain "$pdf" > "${pdf%.pdf}.explain.txt" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: env.JENIS == 'uud'
        with:
          name: uud-check # texts only; the PDFs stay on the runner
          path: |
            ${{ runner.temp }}/uud-check/*.txt
            ${{ runner.temp }}/uud-check/*.md
      - uses: ./.github/actions/ocr-cache
        if: always()
        with:
          step: save
          path: ${{ env.HUKUM_RAPIH_OCR_CACHE }}
